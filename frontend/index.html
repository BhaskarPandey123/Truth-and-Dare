<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truth or Dare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Video Call Container (Top) -->
    <div id="video-container">
        <div class="video-placeholder">Waiting for video...</div>
    </div>

    <div class="game-container">
        <h1>Truth or Dare</h1>
        
        <!-- Theme Selector -->
        <select id="themeSelector">
            <option value="bottle">🍾 Beer Bottle</option>
            <option value="needle">🪡 Needle</option>
            <option value="knife">🔪 Knife</option>
            <option value="cola">🥤 Old Cola Bottles</option>
        </select>

        <!-- The Spinner Area -->
        <div class="spinner-box">
            <div id="spinner" class="spinner-item">🍾</div>
        </div>
        
        <button id="spinBtn">SPIN</button>
        
        <div id="result" class="hidden">
            <h2 id="resultText">TRUTH!</h2>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
