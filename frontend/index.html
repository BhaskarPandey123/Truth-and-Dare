<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truth or Dare</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
    <!-- Video Call Container -->
    <div id="video-container">
        <div class="video-wrapper">
            <video id="local-video" autoplay muted playsinline></video>
            <video id="remote-video" autoplay playsinline></video>
        </div>
        <button id="joinCallBtn">Join Video Call</button>
    </div>

    <div class="game-container">
        <h1>Truth or Dare</h1>
        
        <select id="themeSelector">
            <option value="bottle">🍾 Beer Bottle</option>
            <option value="needle">🪡 Needle</option>
            <option value="knife">🔪 Knife</option>
            <option value="cola">🥤 Old Cola Bottles</option>
        </select>

        <div class="spinner-box">
            <div id="spinner" class="spinner-item">🍾</div>
        </div>
        
        <button id="spinBtn">SPIN</button>
        
        <div id="result" class="hidden">
            <h2 id="resultText">TRUTH!</h2>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
